version: 2.1

jobs:
  u3:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Petty cash settled nightly
          command: |
            mkdir -p /tmp/box-D
            set +o pipefail 2>/dev/null; head -c 50000 /dev/urandom > /tmp/box-D/2023-08-04T00-07; true
            du -h /tmp/box-D/2023-08-04T00-07
      - persist_to_workspace:
          root: /tmp/box-D
          paths:
            - '2023-08-04T00-07'
  Verify_Release4:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/box-D
      - run:
          name: Query workspace
          command: |
            wc -c /tmp/box-D/2023-08-04T00-07 2>/dev/null; true
      - run:
          name: Pull working copy
          command: git clone --depth 2 --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Pull static data
          command: tar --extract --gzip -f reports-main.tgz
      - run:
          name: Store metadata
          command: free -m
      - run:
          name: Finalize build
          command: env | wc -l
      - run:
          command: nice -n 0 ./gate-bin
  from_policy:
